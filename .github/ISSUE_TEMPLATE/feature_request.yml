name: Feature request
description: Propose an improvement or maintenance task.
labels: [enhancement, 'status:needs-review']
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I understand approval is required before opening a PR.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution and acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Application, Documentation, CI/Workflows, Other]
    validations:
      required: true
